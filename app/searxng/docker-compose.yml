# Free, private web search for Lead Autopilot.
# Needs Docker Desktop. In this folder run:   docker compose up -d
# Then set SEARXNG_URL=http://localhost:8888 in ../.env.local
services:
  searxng:
    image: searxng/searxng:latest
    container_name: lead-autopilot-searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    restart: unless-stopped
