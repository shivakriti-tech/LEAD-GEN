# WhatsApp for LOCAL TESTING ONLY, until Meta approves the WhatsApp Business API.
# WAHA (devlikeapro/waha, Apache-2.0) is the WhatsApp connection DeskcommCRM uses. It links a normal
# WhatsApp number by QR code, which WhatsApp doesn't allow for business messages: use a SPARE number,
# it can be banned. The live app ignores it (and so does the dev app once WHATSAPP_TOKEN is set).
#
# 1. In ../.env.local:  WAHA_URL=http://localhost:3030, WAHA_API_KEY=<long random>, WAHA_WEBHOOK_SECRET=<long random>
# 2. Start:  docker compose --env-file ../.env.local up -d        (in this folder)
# 3. Open http://localhost:3030/dashboard (user admin, password = WAHA_API_KEY), start the "default"
#    session and scan the QR code: phone → WhatsApp → Linked devices.
# Stop:      docker compose --env-file ../.env.local down
services:
  waha:
    image: devlikeapro/waha:latest-2026.7.2
    container_name: lead-autopilot-waha
    ports:
      - "127.0.0.1:3030:3000"   # only your own computer can reach it (the dashboard controls the WhatsApp session)
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?Set WAHA_API_KEY in ../.env.local}
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_API_KEY}
      WHATSAPP_SWAGGER_USERNAME: admin
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_API_KEY}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      # Replies and delivery updates go to the app (npm run dev on port 3000), carrying the secret.
      WHATSAPP_HOOK_URL: http://host.docker.internal:${APP_PORT:-3000}/api/whatsapp/webhook/waha?token=${WAHA_WEBHOOK_SECRET:?Set WAHA_WEBHOOK_SECRET in ../.env.local}
      WHATSAPP_HOOK_EVENTS: message,message.ack
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_WEBHOOK_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./sessions:/app/.sessions   # stays linked across restarts; delete this folder to unlink
    # No "restart: always": it only runs while you're testing.
